<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Data Analyst | CipherAscend Tech</title>
<meta name="description" content="Data analyst portfolio: Excel, Power BI, SQL and Python projects, dashboards and case studies.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#fff;--alt:#f3f6fa;--card:#fff;--tx:#1c2433;--mu:#586378;--ac:#0e7c86;--nv:#0b1d3a;--ln:#dfe5ee;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}h1,h2,h3{line-height:1.25;margin:0 0 .5em}p{margin:0 0 1em;color:var(--mu)}
.w{max-width:1100px;margin:0 auto;padding:0 18px}section{padding:56px 0}.alt{background:var(--alt)}
.btn{display:inline-block;background:var(--ac);color:#fff;border:2px solid var(--ac);padding:10px 20px;border-radius:6px;font:600 .95rem Inter,sans-serif;cursor:pointer}
.btn.o{background:transparent;color:var(--ac)}.btn:disabled{opacity:.6;cursor:wait}.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--ln)}
header .w{display:flex;align-items:center;gap:14px;height:64px}.logo{font-weight:700;margin-right:auto}.logo b{color:var(--ac)}
nav{display:flex;gap:4px}nav a{padding:6px 9px;border-radius:6px;font-size:.88rem;font-weight:500;color:var(--mu)}nav a.on,nav a:hover{color:var(--ac);background:var(--alt)}
.ib{background:none;border:1px solid var(--ln);color:var(--tx);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:1rem}#bg{display:none}
@media(max-width:980px){#bg{display:block}nav{display:none;position:absolute;top:64px;left:0;right:0;background:var(--bg);flex-direction:column;padding:10px 18px;border-bottom:1px solid var(--ln)}nav.open{display:flex}.hire{display:none}}
.g{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:20px}
.hero{background:linear-gradient(180deg,#eef6f8,#fff);color:var(--tx);padding:72px 0}.hero p{color:var(--mu)}.hero h1{font-size:clamp(1.9rem,5vw,3rem)}.hero .btn.o{color:var(--ac);border-color:var(--ac)}
.hero .w{display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));align-items:center}.ph{width:200px;height:200px;border-radius:50%;background:#e3f1f3;color:var(--ac);display:grid;place-items:center;font-size:3rem;font-weight:700;margin:auto;overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover}
.tag{display:inline-block;font-size:.75rem;background:var(--alt);color:var(--ac);border:1px solid var(--ln);border-radius:20px;padding:1px 9px;margin:0 4px 4px 0;font-weight:600}
.note{border-left:4px solid var(--ac);background:var(--alt);padding:10px 14px;border-radius:6px;font-size:.9rem;color:var(--mu);margin:0 0 18px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}input,select,textarea{padding:10px;border:1px solid var(--ln);border-radius:6px;background:var(--card);color:var(--tx);font:inherit}textarea{width:100%}
form{display:grid;gap:12px;max-width:560px}.err{color:#d6455d;font-size:.85rem}.hp{position:absolute;left:-9999px}
.big{font-size:2rem;font-weight:700;color:var(--ac);margin:0}footer{background:var(--alt);border-top:1px solid var(--ln);color:var(--mu);padding:30px 0;text-align:center;font-size:.9rem}footer p{color:var(--mu)}
#top{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:none;z-index:15}svg text{fill:var(--mu);font-size:11px}
dialog{max-width:900px;width:94%;max-height:92vh;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);padding:0}dialog::backdrop{background:rgba(15,23,42,.45)}
.st{display:flex;gap:8px;flex-wrap:wrap}.st button{text-align:left}.fs:fullscreen{background:var(--bg);padding:20px;overflow:auto}

:root{--alt:#f1f5f9;--ln:#e2e8f0}
body{-webkit-font-smoothing:antialiased;line-height:1.65}
h1,h2,h3{letter-spacing:-.02em;font-weight:700}h3{font-size:1.1rem;font-weight:600;letter-spacing:-.01em}
section{padding:clamp(30px,4vw,44px) 0;text-align:center}#app>div:nth-child(even) section{background:var(--alt)}
section h2{font-size:clamp(1.55rem,3.4vw,2.05rem);position:relative;padding-bottom:14px;margin-bottom:.8em}
section h2::after{content:"";position:absolute;left:50%;bottom:0;width:48px;height:3px;border-radius:3px;background:var(--ac);transform:translateX(-50%)}
section>.w>p{max-width:720px;margin-left:auto;margin-right:auto}
.card{text-align:left;background:var(--card);border:1px solid var(--ln);border-top:3px solid var(--ac);border-radius:12px;padding:24px;box-shadow:0 1px 2px rgba(11,29,58,.05),0 8px 24px rgba(11,29,58,.06);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(11,29,58,.13)}
.card h3{margin-bottom:.4em}.card p{font-size:.95rem}.card ul{padding-left:20px;margin:0;color:var(--mu);font-size:.95rem}
.tag{background:rgba(14,124,134,.12);color:var(--ac);border:0;border-radius:999px;padding:3px 11px;font-size:.75rem;font-weight:600}
.btn{border-radius:8px;padding:11px 22px;line-height:1.2;letter-spacing:.01em;transition:transform .15s,opacity .15s}.btn:hover{transform:translateY(-1px)}
.hero{padding:48px 0 52px}.hero .w{display:flex;flex-direction:column;align-items:center;text-align:center}
.ph{width:176px;height:176px;margin:0 0 22px;border:4px solid #fff;box-shadow:0 10px 30px rgba(11,29,58,.18);font-size:3.2rem}
.hero h1{font-size:clamp(1.9rem,5.2vw,2.8rem);font-weight:800;margin:0 0 .25em;color:var(--nv)}
.hero .ttl{font-size:clamp(.95rem,2.4vw,1.15rem);font-weight:600;color:var(--ac);letter-spacing:.02em;margin:0 0 1.1em}
.hero .bio{max-width:640px;font-size:1.05rem;margin:0 0 1.8em}
.hero .cta{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.st{justify-content:center}dialog{text-align:left}
input,select,textarea{border-radius:8px;padding:11px 12px}label{font-weight:500;font-size:.9rem}
.shot{display:block;width:100%;padding:0;margin:0 0 12px;border:1px solid var(--ln);border-radius:8px;overflow:hidden;background:var(--alt);cursor:zoom-in;position:relative}
.shot img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;transition:transform .3s}.shot:hover img{transform:scale(1.03)}
.shot::after{content:"Click to enlarge";position:absolute;right:8px;bottom:8px;background:rgba(15,23,42,.75);color:#fff;font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:999px}
.cap{font-size:.88rem;margin:0 0 12px;font-style:italic}
#dc{padding:18px;text-align:center}#dc img{max-width:100%;max-height:72vh;border-radius:8px;border:1px solid var(--ln)}#dc .cap{margin:14px auto 0;max-width:680px;font-size:1rem}#dc [data-close]{margin-bottom:14px}
nav a,.logo,.hire{white-space:nowrap}@media(max-width:1180px){nav a{padding:6px 7px;font-size:.84rem}}
</style>
</head>
<body>
<header><div class="w"><a href="#home" class="logo">Cipher<b>Ascend</b> Tech</a>
<nav id="nv" aria-label="Main"></nav><a class="btn hire" href="#contact">Hire Me</a>
<button class="ib" id="bg" aria-label="Open menu" aria-expanded="false">☰</button></div></header>
<main id="app" tabindex="-1"></main>
<footer><div class="w"><p id="ft"></p><div id="fl" style="margin-bottom:10px"></div></div></footer>
<dialog id="dlg" aria-label="Dashboard image"><div id="dc"></div></dialog>
<button class="btn" id="top" aria-label="Back to top">↑ Top</button>
<script>
/* ===== EDIT THIS CONFIG ===== */
const C={name:"Saifullah Muhammad",brand:"CipherAscend Tech",title:"Data Analyst | Business Intelligence | Advanced Analytics",
email:"",whatsapp:"+2348134914726" /* number with country code, e.g. 2348012345678 */,linkedin:"",facebook:"",tiktok:"",github:"",photo:"cipherascendtech@gmail.com",resumeUrl:"",
bio:"I transform complex data into meaningful insights that help businesses understand performance, identify opportunities, solve problems and make informed decisions.",
stats:[/* {v:"5",l:"Projects completed"} — add only verified figures */],
dashboards:[{t:"Executive BI Dashboard (demo)",d:"Placeholder entry. Add a published Power BI report URL in the url field to embed it.",url:"",kpis:"Revenue, profit margin, customer retention, delivery performance"}],
articles:[{id:"a1",t:"Cleaning messy data with Power Query",cat:"Excel",min:3,date:"",body:"Draft outline: profile the columns, fix data types, remove duplicates, standardise values, document every step."},
{id:"a2",t:"Window functions for running totals in SQL",cat:"SQL",min:3,date:"",body:"Draft outline: SUM() OVER (PARTITION BY … ORDER BY …) lets you compute running totals without self-joins."},
{id:"a3",t:"Choosing the right KPI denominator",cat:"Business Intelligence",min:2,date:"",body:"Draft outline: retention, churn and conversion all change meaning when the denominator changes. State it explicitly."}]};
/* ===== DATA ===== */

const P=[
["hr","HR Analytics","Human Resources",["Excel","Power BI","SQL"],"Workforce composition, turnover and attendance.","Which departments lose staff fastest and why?",["Headcount","Turnover % = leavers ÷ average headcount","Retention","Attendance rate"],"Turnover concentrates in a few departments (demo).",[48,52,61,44]],
["sales","Sales Analytics","Sales",["Excel","SQL","Python"],"Revenue growth, regional and product performance with forecast.","Where is revenue growing or stalling?",["Total sales","Revenue growth % (MoM)","Sales by region","Forecast MAPE"],"Two regions drive most growth (demo).",[120,135,128,160]],
["fin","Financial Analytics","Finance",["Excel","Power BI"],"Revenue, expenses, margins and budget vs actual.","Are margins holding against budget?",["Gross profit","Net margin = net profit ÷ revenue","Opex ratio","Budget variance"],"Operating costs overrun budget in Q3 (demo).",[30,28,22,31]],
["cust","Customer Analytics","Customer Analytics",["SQL","Python"],"Segmentation, churn and lifetime value.","Which customers are worth retaining?",["Churn rate","CLV","Purchase frequency","Retention"],"A small segment yields most lifetime value (demo).",[80,76,71,74]],
["mkt","Marketing Analytics","Marketing",["Excel","Power BI","SQL"],"Campaign performance, CAC and ROAS by channel.","Which channels return the best spend?",["Conversion rate","CAC","ROAS","Marketing ROI"],"Email outperforms paid social on ROAS (demo).",[2.1,3.4,1.8,2.6]],
["ops","Inventory & Operations Analytics","Operations",["Excel","SQL","Power BI"],"Stock availability, reorder levels and delivery performance.","Where do stock-outs and late deliveries originate?",["Inventory turnover","Stock availability","On-time delivery %","Reorder point"],"Late deliveries cluster around two suppliers (demo).",[92,89,94,91]],
["pred","Predictive Analytics","Predictive Analytics",["Python"],"Regression, classification and forecasting with evaluation.","Can we predict demand or churn reliably?",["R²","RMSE","Precision / recall","Forecast error"],"Model beats the naive baseline (demo).",[0.62,0.71,0.68,0.74]]];
/* ===== DASHBOARD IMAGES: add your screenshot path and a one-line insight for each project =====
   src: image file next to this page, e.g. "images/hr.png" (or a full https:// link). Leave "" to hide the image.
   cap: short caption describing the insight the dashboard shows. */
const IMAGES={
hr:{src:"",cap:""},
sales:{src:"",cap:""},
fin:{src:"",cap:""},
cust:{src:"",cap:""},
mkt:{src:"",cap:""},
ops:{src:"",cap:""},
pred:{src:"",cap:""}
};
const SV=[["Data cleaning and preparation","Messy, inconsistent data","Clean, documented dataset","Excel, SQL, Python"],["Excel data analysis","Manual, error-prone reporting","Analysis workbook with PivotTables","Excel"],["SQL database analysis","Data locked in databases","Extraction scripts and results","SQL"],["Power BI dashboard development","No single view of performance","Interactive dashboard","Power BI"],["Business intelligence reporting","Slow management reporting","Recurring BI report","Power BI, Excel"],["Financial performance analysis","Unclear margins and variances","Financial KPI report","Excel, Power BI"],["Sales performance analysis","Unknown growth drivers","Sales insights report","Excel, SQL"],["HR analytics","Turnover and attendance issues","Workforce dashboard","Excel, Power BI"],["Marketing analytics","Unclear campaign ROI","Channel performance report","Excel, Power BI"],["Customer analytics","Churn and segmentation","Segment and churn analysis","SQL, Python"],["Operations analytics","Stock and delivery problems","Operations KPI report","Excel, SQL"],["Predictive analytics and forecasting","Planning without forecasts","Model and forecast report","Python"],["Data automation","Repetitive manual tasks","Automated workflow","Python, Excel"],["Statistical analysis","Decisions without evidence","Hypothesis and regression report","Python"],["Business performance consulting","Unclear priorities","Recommendations and KPI plan","All tools"]];
const SK={"Excel":["Data cleaning","XLOOKUP / INDEX-MATCH","PivotTables","Power Query","Data validation","Conditional formatting","KPI calculations"],"Power BI":["Power Query","Data modelling","DAX measures","Relationships","Interactive dashboards","Drill-through","Row-level security","Publishing"],"SQL":["SELECT / filtering","Aggregates & GROUP BY","JOINs","Subqueries","CTEs","Window functions"],"Python":["Pandas","NumPy","Matplotlib / Seaborn","SciPy","Scikit-learn","Statistical analysis","Automation"],"Analytics":["Descriptive & inferential statistics","Correlation & regression","Hypothesis testing","Forecasting","Data storytelling"]};
const ST=[["Business understanding","Define the objective, stakeholders, problem and analytical questions."],["Data extraction","Identify and document sources; extract with SQL; import Excel files."],["Data cleaning","Missing values, duplicates, data types, inconsistencies, outliers — every decision documented."],["Data transformation","Join tables, create calculated fields, build relationships, prepare analysis-ready data."],["Exploratory analysis","Distributions, summary statistics, trends, relationships and anomalies."],["KPI development","Define each KPI, show its formula, choose the right denominator, validate."],["Advanced analysis","Hypothesis tests, correlation, regression, forecasting, predictive models."],["Visualisation","Charts, dashboards and interactive reports."],["Business interpretation","Explain findings, quantify opportunities, state limitations."],["Recommendations","Prioritised actions, expected impact and monitoring metrics."]];
/* ===== HELPERS ===== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const NAV=[["home","Home"],["about","About"],["skills","Skills"],["services","Services"],["projects","Projects"],["dashboards","Dashboards"],["method","Case Studies"],["resume","Resume"],["insights","Insights"],["contact","Contact"]];
const links=()=>[[C.whatsapp&&"https://wa.me/"+C.whatsapp.replace(/\D/g,""),"WhatsApp"],[C.linkedin,"LinkedIn"],[C.facebook,"Facebook"],[C.tiktok,"TikTok"],[C.github,"GitHub"],[C.email&&"mailto:"+C.email,"Email"]].filter(x=>x[0]).map(x=>`<a class="btn o" href="${x[0]}" target="_blank" rel="noopener">${x[1]}</a>`).join(" ");
const tags=a=>a.map(t=>`<span class="tag">${t}</span>`).join("");
function pcard(p){const m=IMAGES[p[0]]||{};return `<article class="card"><span class="tag">${p[2]}</span><h3>${p[1]}</h3>${m.src?`<button class="shot" data-img="${p[0]}" aria-label="Enlarge ${p[1]} dashboard image"><img src="${m.src}" alt="${p[1]} dashboard" loading="lazy"></button>`:""}${m.cap?`<p class="cap">${m.cap}</p>`:""}<p>${p[4]}</p><div>${tags(p[3])}</div></article>`}
/* ===== VIEWS ===== */
const V={
home(){const s=C.stats.map(x=>`<div class="card"><p class="big">${x.v}</p>${x.l}</div>`).join("");return `<div class="hero"><div class="w"><div class="ph" aria-label="Profile photo">${C.photo?`<img src="${C.photo}" alt="${C.name}">`:C.name[0]}</div><h1>${C.name}</h1><p class="ttl">${C.title}</p><p class="bio">${C.bio}</p><div class="cta"><a class="btn" href="#projects">Explore My Projects</a><a class="btn o" href="#dashboards">View My Dashboards</a><a class="btn o" href="#resume">Download My Resume</a><a class="btn o" href="#contact">Contact Me</a></div></div></div>
${s?`<section><div class="w g">${s}</div></section>`:""}
<section class="alt"><div class="w"><h2>Core tools</h2><div class="g">${[["Excel","Cleaning, PivotTables, Power Query and KPI workbooks."],["Power BI","Data models, DAX and interactive dashboards."],["SQL","Extraction, joins, CTEs and window functions."],["Python","Pandas, statistics, visualisation and modelling."]].map(t=>`<div class="card"><h3>${t[0]}</h3><p>${t[1]}</p></div>`).join("")}</div></div></section>
<section class="alt"><div class="w"><h2>From data to decisions</h2><p>Understand the business question, prepare trustworthy data, analyse with the right method, visualise clearly and recommend practical actions — see the <a href="#method" style="color:var(--ac)">full workflow</a>.</p><a class="btn" href="#contact">Let’s Work Together</a></div></section>`},
about(){return `<section><div class="w"><h2>About me</h2><p>${C.bio}</p><div class="g"><div class="card"><h3>Analytical philosophy</h3><p>Start with the decision to be made, then let the data answer it.</p></div><div class="card"><h3>Methodology</h3><p>A documented 10-step workflow from business understanding to recommendations.</p></div></div></div></section>`},
skills(){return `<section><div class="w"><h2>Technical skills</h2><div class="g">${Object.entries(SK).map(([k,v])=>`<div class="card"><h3>${k}</h3>${tags(v)}</div>`).join("")}</div></div></section>`},
services(){return `<section><div class="w"><h2>Services</h2><div class="g">${SV.map((s,i)=>`<div class="card"><h3>${s[0]}</h3><p><b>Problem:</b> ${s[1]}<br><b>Deliverable:</b> ${s[2]}</p>${tags(s[3].split(", "))}<div><a class="btn o" href="#contact">Get in touch</a></div></div>`).join("")}</div></div></section>`},
projects(){return `<section><div class="w"><h2>Projects</h2><div class="g">${P.map(pcard).join("")}</div></div></section>`},
dashboards(){return `<section><div class="w"><h2>Dashboards</h2>${C.dashboards.map((d,i)=>`<div class="card fs" id="db${i}" style="margin-bottom:18px"><h3>${d.t}</h3><p>${d.d}</p><p><b>KPIs:</b> ${d.kpis}</p>${d.url?`<iframe src="${d.url}" title="${d.t}" style="width:100%;height:420px;border:0" loading="lazy"></iframe><p class="note">If the report doesn’t load, <a style="color:var(--ac)" href="${d.url}" target="_blank" rel="noopener">open it in a new tab</a>.</p>`:`<p class="note">No published report linked yet — set <code>url</code> for this dashboard in the config. No live data is simulated.</p>`}<button class="btn o" data-fs="db${i}">Full screen</button></div>`).join("")}</div></section>`},
method(){return `<section><div class="w"><h2>Analytical workflow</h2><div class="st" id="sp">${ST.map((s,i)=>`<span class="tag" style="font-size:.9rem;padding:8px 16px">${i+1}. ${s[0]}</span>`).join("")}</div></div></section>`},
resume(){return `<section><div class="w"><h2>Resume</h2>${C.resumeUrl?`<a class="btn" href="${C.resumeUrl}" download>Download PDF resume</a>`:`<p class="note">No PDF resume has been uploaded yet. Set <code>CONFIG.resumeUrl</code> to the file’s URL to enable the download.</p>`}<p>${links()||"Professional profile links will appear here once configured."}</p></div></section>`},
insights(){return `<section><div class="w"><h2>Insights</h2><div class="g">${C.articles.map(a=>`<article class="card"><span class="tag">${a.cat}</span><h3>${a.t}</h3><p style="font-size:.85rem">${a.date||"Date not set"} · ${a.min} min read · draft</p><p>${a.body}</p></article>`).join("")}</div></div></section>`},
contact(){return `<section><div class="w"><h2>Contact</h2><p>${links()||"WhatsApp, LinkedIn, Facebook and TikTok buttons appear here once their links are added to the config."}</p></div></section>`},
nf(){return `<section><div class="w"><h1>404 — Page not found</h1><p>That page doesn’t exist.</p><a class="btn" href="#home">Back to home</a></div></section>`}};
/* ===== ROUTER ===== */
const SEC=["home","about","skills","services","projects","dashboards","method","resume","insights","contact"];
function route(){$("#app").innerHTML=SEC.map(b=>`<div id="${b}">${V[b]()}</div>`).join("");SEC.forEach(b=>init(b));spy()}
function spy(){const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting)$$("#nv a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+en.target.id))}),{rootMargin:"-40% 0px -55% 0px"});SEC.forEach(k=>io.observe(document.getElementById(k)))}
function init(b){
if(b==="dashboards")$$("[data-fs]").forEach(x=>x.onclick=()=>{const e=document.getElementById(x.dataset.fs);try{e.requestFullscreen()}catch(er){alert("Full screen isn’t supported in this browser.")}});}
/* ===== BOOT ===== */
$("#nv").innerHTML=NAV.map(n=>`<a href="#${n[0]}">${n[1]}</a>`).join("");
$("#fl").innerHTML=links();$("#ft").textContent="© "+new Date().getFullYear()+" "+C.name+" · "+C.brand;
$("#bg").onclick=()=>{const o=$("#nv").classList.toggle("open");$("#bg").setAttribute("aria-expanded",o)};
$("#top").onclick=()=>window.scrollTo({top:0,behavior:"smooth"});addEventListener("scroll",()=>{$("#top").style.display=scrollY>400?"block":"none"});
$("#nv").onclick=e=>{if(e.target.tagName==="A"){$("#nv").classList.remove("open");$("#bg").setAttribute("aria-expanded","false")}};
document.addEventListener("click",e=>{const d=$("#dlg");if(e.target===d||e.target.closest("[data-close]"))return d.close();const t=e.target.closest("[data-img]");if(!t)return;
const id=t.dataset.img,m=IMAGES[id],pr=P.find(x=>x[0]===id);$("#dc").innerHTML=`<button class="btn o" data-close>← Close</button><div><img src="${m.src}" alt="${pr[1]} dashboard"></div>${m.cap?`<p class="cap">${m.cap}</p>`:""}`;d.showModal()});
route();
</script>
</body>
</html>
